<!DOCTYPE html>
<html>
<head>

<title>Responsive Time Table</title>

<meta name="viewport"
content="width=device-width, initial-scale=1">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<style>

body{
    background-color:#f2f2f2;
}

.heading{
    text-align:center;
    margin-top:30px;
    margin-bottom:30px;
    color:darkblue;
}

.row-style{
    border:1px solid black;
    padding:15px;
}

.header{
    background-color:blue;
    color:white;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h2 class="heading">
Class Time Table
</h2>


<div class="row row-style header text-center">

<div class="col-md-3">
Day
</div>

<div class="col-md-3">
9 AM - 10 AM
</div>

<div class="col-md-3">
10 AM - 11 AM
</div>

<div class="col-md-3">
11 AM - 12 PM
</div>

</div>



<div class="row row-style text-center bg-light">

<div class="col-md-3">
Monday
</div>

<div class="col-md-3">
HTML
</div>

<div class="col-md-3">
CSS
</div>

<div class="col-md-3">
JavaScript
</div>

</div>



<div class="row row-style text-center">

<div class="col-md-3">
Tuesday
</div>

<div class="col-md-3">
Bootstrap
</div>

<div class="col-md-3">
React
</div>

<div class="col-md-3">
Node.js
</div>

</div>



<div class="row row-style text-center bg-light">

<div class="col-md-3">
Wednesday
</div>

<div class="col-md-3">
MongoDB
</div>

<div class="col-md-3">
Express.js
</div>

<div class="col-md-3">
Lab
</div>

</div>

</div>

</body>
</html>
