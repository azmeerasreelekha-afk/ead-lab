<!DOCTYPE html>
<html>
<head>

<title>Bootstrap Registration Form</title>

<meta name="viewport"
content="width=device-width, initial-scale=1">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<style>

body{
    background-color:#e9ecef;
}

.card{
    margin-top:50px;
    border-radius:15px;
}

h2{
    color:darkblue;
}

</style>

</head>

<body>

<div class="container">

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card shadow p-4">

<h2 class="text-center mb-4">
Student Registration Form
</h2>

<form>



<div class="mb-3">

<label class="form-label">
Full Name
</label>

<input type="text"
class="form-control"
placeholder="Enter Name">

</div>



<div class="mb-3">

<label class="form-label">
Email Address
</label>

<input type="email"
class="form-control"
placeholder="Enter Email">

</div>



<div class="mb-3">

<label class="form-label">
Password
</label>

<input type="password"
class="form-control"
placeholder="Enter Password">

</div>



<div class="mb-3">

<label class="form-label">
Gender
</label>

<br>

<input type="radio"
name="gender">
Male

<input type="radio"
name="gender"
class="ms-3">
Female

</div>



<div class="mb-3">

<label class="form-label">
Select Course
</label>

<select class="form-select">

<option>CSE</option>
<option>ECE</option>
<option>IT</option>
<option>AIML</option>

</select>

</div>



<div class="mb-3">

<label class="form-label">
Skills
</label>

<br>

<input type="checkbox">
HTML

<input type="checkbox"
class="ms-2">
CSS

<input type="checkbox"
class="ms-2">
JavaScript

</div>



<div class="mb-3">

<label class="form-label">
Address
</label>

<textarea class="form-control"
rows="3"></textarea>

</div>



<div class="d-grid">

<button class="btn btn-primary">
Register
</button>

</div>

</form>

</div>

</div>

</div>

</div>

</body>
</html>
