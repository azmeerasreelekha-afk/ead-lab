<!DOCTYPE html>
<html>
<head>
    <title>Advanced Calculator</title>

    <style>
        body{
            font-family:Arial;
            text-align:center;
            margin-top:80px;
        }

        input{
            padding:10px;
            margin:10px;
        }

        button{
            padding:10px 20px;
            margin:5px;
        }
    </style>
</head>

<body>

<h2>Advanced Calculator</h2>

<input type="number" id="num1" placeholder="Enter First Number">

<input type="number" id="num2" placeholder="Enter Second Number">

<br>

<button onclick="calculate(add)">Addition</button>

<button onclick="calculate(subtract)">Subtraction</button>

<button onclick="calculate(multiply)">Multiplication</button>

<button onclick="calculate(divide)">Division</button>

<h3 id="output"></h3>

<script>

function add(a,b){
    return a+b;
}

function subtract(a,b){
    return a-b;
}

function multiply(a,b){
    return a*b;
}

function divide(a,b){
    return a/b;
}

function calculate(operation){

    let n1 = parseFloat(document.getElementById("num1").value);

    let n2 = parseFloat(document.getElementById("num2").value);

    let result = operation(n1,n2);

    document.getElementById("output").innerHTML =
    "Result = " + result;
}

</script>

</body>
</html>
