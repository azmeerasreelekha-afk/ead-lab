<!DOCTYPE html>
<html>
<head>
    <title>Number Analyzer</title>

    <style>
        body{
            font-family:Arial;
            text-align:center;
            margin-top:80px;
        }

        input{
            padding:10px;
        }

        button{
            padding:10px 20px;
        }
    </style>
</head>

<body>

<h2>Number Analyzer Dashboard</h2>

<input type="number" id="num" placeholder="Enter Number">

<button onclick="analyze()">Analyze</button>

<h3 id="result"></h3>

<script>

function analyze(){

    let n = parseInt(document.getElementById("num").value);

    let output = "";

   
    if(n % 2 == 0)
        output += "Even Number<br>";
    else
        output += "Odd Number<br>";

    
    if(n > 0)
        output += "Positive Number<br>";
    else if(n < 0)
        output += "Negative Number<br>";
    else
        output += "Zero<br>";

    let prime = true;

    if(n <= 1)
        prime = false;

    for(let i=2; i<n; i++){
        if(n % i == 0){
            prime = false;
            break;
        }
    }

    if(prime)
        output += "Prime Number";
    else
        output += "Not a Prime Number";

    document.getElementById("result").innerHTML = output;
}

</script>

</body>
</html>
